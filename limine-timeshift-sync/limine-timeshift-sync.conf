# Settings for limine-timeshift-sync. Every line is optional; the values shown
# are the defaults.

# The partition holding limine.conf. Found automatically among /efi, /boot and
# /boot/efi when unset.
#ESP_PATH=""

# Name of the menu entry the snapshots are listed under. Must not be
# "Snapshots", which limine-snapper-sync owns.
#ENTRY_TITLE="Timeshift snapshots"

# How many of the newest snapshots get a boot entry.
#MAX_SNAPSHOTS=10

# Kernels are copied to the ESP so a snapshot stays bootable after an upgrade.
# No new copies are made once the ESP is fuller than this, in percent.
#ESP_USAGE_LIMIT=85

# Run after limine.conf changes, when the loader has a config hash enrolled:
# the loader refuses to boot a config that does not match it.
#ENROLL_COMMAND="limine-enroll-config"
