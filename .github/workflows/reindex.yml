name: Reindex the repository database

# Rebuilds the database from every package published in the projects'
# "pacman" releases (see releases.conf), rather than from the packages one
# build happened to produce. Run it after uploading packages to one of those
# releases by hand, or to recover a database that has drifted.
#
# Packages still published in this repository's own release, where they all
# used to be, are moved to their projects' releases first and then deleted
# here, so that this release holds the database and nothing else.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_NAME: malik05
  RELEASE_TAG: repo
  PACKAGES_TAG: pacman
  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

jobs:
  reindex:
    name: Reindex
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    # The rebuild below uses associative arrays; without this a container job
    # runs each step under sh.
    defaults:
      run:
        shell: bash

    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git github-cli gnupg

      - name: Checkout
        uses: actions/checkout@v4

      - name: Import the signing key
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          set -eu
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          echo "GPG_KEY_ID=$fpr" >>"$GITHUB_ENV"
          echo "Signing as $fpr"

      - name: Fetch the published packages
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          OWN_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::the RELEASES_TOKEN secret is not set; see the README"
            exit 1
          fi
          mkdir -p /tmp/pkgs /tmp/legacy

          # A project whose release does not exist yet simply has nothing.
          awk '!/^[[:space:]]*(#|$)/ { print $2 }' releases.conf | sort -u | while read -r repo; do
            gh release download "$PACKAGES_TAG" --repo "$repo" --dir /tmp/pkgs --clobber \
              --pattern '*.pkg.tar.zst' --pattern '*.pkg.tar.zst.sig' || true
          done

          GH_TOKEN=$OWN_TOKEN gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir /tmp/legacy --pattern '*.pkg.tar.zst' --pattern '*.pkg.tar.zst.sig' || true

          # A package already in its project's release keeps that copy.
          for f in /tmp/legacy/*; do
            [ -e "$f" ] || continue
            [ -e "/tmp/pkgs/$(basename "$f")" ] || mv "$f" /tmp/pkgs/
          done
          ls -l /tmp/pkgs

      - name: Sign whatever is not signed yet
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          set -eu
          # Packages uploaded by hand arrive without a signature. Under
          # SigLevel = Required pacman refuses those, so sign them here rather
          # than leave half the repository uninstallable.
          for pkg in /tmp/pkgs/*.pkg.tar.zst; do
            [ -e "$pkg" ] || continue
            if [ ! -e "$pkg.sig" ]; then
              echo "signing $(basename "$pkg")"
              gpg --batch --yes --detach-sign --no-armor -u "$GPG_KEY_ID" "$pkg"
            fi
          done

      - name: Rebuild the database
        run: |
          set -eu
          mkdir -p /tmp/repo

          # Superseded versions stay in the releases as assets, so index only
          # the newest of each package name. pkgname is read out of .PKGINFO
          # because a filename cannot be split reliably: plenty of package
          # names contain the dash the fields are separated by. A package
          # releases.conf does not map, such as one under a retired name, is
          # left out.
          declare -A newest
          for pkg in /tmp/pkgs/*.pkg.tar.zst; do
            [ -e "$pkg" ] || continue
            if ! .github/scripts/release-repo "$pkg" >/dev/null; then
              echo "skipping $(basename "$pkg"): releases.conf does not map it"
              continue
            fi
            info="$(bsdtar -xOqf "$pkg" .PKGINFO)"
            name="$(awk -F' = ' '$1 == "pkgname" { print $2 }' <<<"$info")"
            ver="$(awk -F' = ' '$1 == "pkgver" { print $2 }' <<<"$info")"
            # An empty name would be a fatal bad subscript below, so a package
            # whose .PKGINFO could not be read is passed over instead.
            if [ -z "$name" ] || [ -z "$ver" ]; then
              echo "skipping $(basename "$pkg"): no pkgname/pkgver in .PKGINFO"
              continue
            fi
            if [ -z "${newest[$name]:-}" ] \
            || [ "$(vercmp "$ver" "${newest[$name]%%|*}")" -gt 0 ]; then
              newest[$name]="$ver|$pkg"
            fi
          done

          keep=()
          for name in "${!newest[@]}"; do
            echo "indexing $name ${newest[$name]%%|*}"
            keep+=("${newest[$name]#*|}")
          done
          printf '%s\n' "${keep[@]}" >/tmp/indexed

          # repo-add records a package's signature only if it sits beside it.
          repo_pkgs=()
          for pkg in "${keep[@]}"; do
            if [ -e "$pkg.sig" ]; then
              cp "$pkg.sig" /tmp/repo/
            fi
            cp "$pkg" /tmp/repo/
            repo_pkgs+=("/tmp/repo/$(basename "$pkg")")
          done

          if [ -n "${GPG_KEY_ID:-}" ]; then
            repo-add --sign --key "$GPG_KEY_ID" \
              "/tmp/repo/$REPO_NAME.db.tar.gz" "${repo_pkgs[@]}"
            gpg --export --armor "$GPG_KEY_ID" >"/tmp/repo/$REPO_NAME.asc"
          else
            repo-add "/tmp/repo/$REPO_NAME.db.tar.gz" "${repo_pkgs[@]}"
          fi

          # repo-add leaves .db and .files (and their signatures) as symlinks
          # to the tarballs, and a release asset cannot be a symlink, so
          # publish copies instead.
          for suffix in '' .sig; do
            for name in db files; do
              rm -f "/tmp/repo/$REPO_NAME.$name$suffix"
              if [ -e "/tmp/repo/$REPO_NAME.$name.tar.gz$suffix" ]; then
                cp "/tmp/repo/$REPO_NAME.$name.tar.gz$suffix" \
                   "/tmp/repo/$REPO_NAME.$name$suffix"
              fi
            done
          done

          rm -f /tmp/repo/*.pkg.tar.zst /tmp/repo/*.pkg.tar.zst.sig /tmp/repo/*.old /tmp/repo/*.old.sig
          ls -l /tmp/repo

      # Every indexed package, with the signature minted above if it had none,
      # ends up in its project's release, whichever release it was found in.
      - name: Publish the indexed packages in their projects' releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -eu
          while read -r pkg; do
            .github/scripts/publish-package "$pkg"
          done </tmp/indexed

      - name: Publish the database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            /tmp/repo/* --clobber

      # Only once the database pointing at the projects' releases is out.
      - name: Leave only the database in this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            grep -E '\.pkg\.tar\.zst(\.sig)?$|\.old(\.sig)?$' |
            while read -r asset; do
              gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
              echo "deleted $asset"
            done
