name: Reindex the repository database

# Rebuilds the database from every package published in the release, rather
# than from the packages one build happened to produce. Run it after adding
# packages to the release by hand, or to recover a database that has drifted.
#
# Packages still in the projects' "pacman" releases, where they were published
# for a while, are brought back into this release first.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_NAME: malik05
  RELEASE_TAG: repo
  PACKAGES_TAG: pacman
  # Earlier names of limine-extra, never to be indexed again.
  RETIRED: limine limine-systemd-bootctl
  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

jobs:
  reindex:
    name: Reindex
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    # The rebuild below uses associative arrays; without this a container job
    # runs each step under sh.
    defaults:
      run:
        shell: bash

    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git github-cli gnupg

      - name: Checkout
        uses: actions/checkout@v4

      - name: Import the signing key
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          set -eu
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          echo "GPG_KEY_ID=$fpr" >>"$GITHUB_ENV"
          echo "Signing as $fpr"

      - name: Fetch the published packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p /tmp/pkgs
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir /tmp/pkgs --pattern '*.pkg.tar.zst' --pattern '*.pkg.tar.zst.sig' || true
          # Only what is missing from the release, and the signatures minted
          # below, need uploading afterwards.
          ls /tmp/pkgs >/tmp/published

          # The projects are public, so this token can read their releases.
          for repo in malik05051/Limine-extra malik05051/limine-timeshift-sync \
                      malik05051/DLSS5-NeuralScreen-Linux malik05051/systemd-arab-edition; do
            mkdir -p /tmp/project
            gh release download "$PACKAGES_TAG" --repo "$repo" --dir /tmp/project \
              --pattern '*.pkg.tar.zst' --pattern '*.pkg.tar.zst.sig' || true
            for f in /tmp/project/*; do
              [ -e "$f" ] || continue
              [ -e "/tmp/pkgs/$(basename "$f")" ] || mv "$f" /tmp/pkgs/
            done
            rm -rf /tmp/project
          done
          ls -l /tmp/pkgs

      - name: Sign whatever is not signed yet
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          set -eu
          # Packages uploaded by hand arrive without a signature. Under
          # SigLevel = Required pacman refuses those, so sign them here rather
          # than leave half the repository uninstallable.
          for pkg in /tmp/pkgs/*.pkg.tar.zst; do
            [ -e "$pkg" ] || continue
            if [ ! -e "$pkg.sig" ]; then
              echo "signing $(basename "$pkg")"
              gpg --batch --yes --detach-sign --no-armor -u "$GPG_KEY_ID" "$pkg"
            fi
          done

      - name: Rebuild the database
        run: |
          set -eu
          mkdir -p /tmp/repo

          # Superseded versions stay in the release as assets, so index only
          # the newest of each package name. pkgname is read out of .PKGINFO
          # because a filename cannot be split reliably: plenty of package
          # names contain the dash the fields are separated by.
          declare -A newest
          for pkg in /tmp/pkgs/*.pkg.tar.zst; do
            [ -e "$pkg" ] || continue
            info="$(bsdtar -xOqf "$pkg" .PKGINFO)"
            name="$(awk -F' = ' '$1 == "pkgname" { print $2 }' <<<"$info")"
            ver="$(awk -F' = ' '$1 == "pkgver" { print $2 }' <<<"$info")"
            # An empty name would be a fatal bad subscript below, so a package
            # whose .PKGINFO could not be read is passed over instead.
            if [ -z "$name" ] || [ -z "$ver" ]; then
              echo "skipping $(basename "$pkg"): no pkgname/pkgver in .PKGINFO"
              continue
            fi
            if [[ " $RETIRED " == *" $name "* ]]; then
              echo "skipping $(basename "$pkg"): $name is retired"
              continue
            fi
            if [ -z "${newest[$name]:-}" ] \
            || [ "$(vercmp "$ver" "${newest[$name]%%|*}")" -gt 0 ]; then
              newest[$name]="$ver|$pkg"
            fi
          done

          keep=()
          for name in "${!newest[@]}"; do
            echo "indexing $name ${newest[$name]%%|*}"
            keep+=("${newest[$name]#*|}")
          done

          # repo-add records a package's signature only if it sits beside it.
          repo_pkgs=()
          for pkg in "${keep[@]}"; do
            if [ -e "$pkg.sig" ]; then
              cp "$pkg.sig" /tmp/repo/
            fi
            cp "$pkg" /tmp/repo/
            repo_pkgs+=("/tmp/repo/$(basename "$pkg")")
          done

          if [ -n "${GPG_KEY_ID:-}" ]; then
            repo-add --sign --key "$GPG_KEY_ID" \
              "/tmp/repo/$REPO_NAME.db.tar.gz" "${repo_pkgs[@]}"
            gpg --export --armor "$GPG_KEY_ID" >"/tmp/repo/$REPO_NAME.asc"
          else
            repo-add "/tmp/repo/$REPO_NAME.db.tar.gz" "${repo_pkgs[@]}"
          fi

          # repo-add leaves .db and .files (and their signatures) as symlinks
          # to the tarballs, and a release asset cannot be a symlink, so
          # publish copies instead.
          for suffix in '' .sig; do
            for name in db files; do
              rm -f "/tmp/repo/$REPO_NAME.$name$suffix"
              if [ -e "/tmp/repo/$REPO_NAME.$name.tar.gz$suffix" ]; then
                cp "/tmp/repo/$REPO_NAME.$name.tar.gz$suffix" \
                   "/tmp/repo/$REPO_NAME.$name$suffix"
              fi
            done
          done

          rm -f /tmp/repo/*.old /tmp/repo/*.old.sig
          while read -r f; do
            rm -f "/tmp/repo/$f"
          done </tmp/published
          ls -l /tmp/repo

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            /tmp/repo/* --clobber

      # repo-add writes .tar.gz databases; any other copy was uploaded by hand
      # and is stale by now.
      - name: Delete stale database copies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            { grep -E '\.old(\.sig)?$|\.(db|files)\.tar\.(zst|xz|bz2)(\.sig)?$' || true; } |
            while read -r asset; do
              gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
              echo "deleted $asset"
            done

      - name: Delete the superseded limine-timeshift-sync from Limine-extra
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          OWN_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view "$PACKAGES_TAG" --repo malik05051/Limine-extra --json assets --jq '.assets[].name' |
            { grep -E '^limine-timeshift-sync-1\.1\.0-1-any\.pkg\.tar\.zst(\.sig)?$' || true; } |
            while read -r asset; do
              gh release delete-asset "$PACKAGES_TAG" "$asset" --repo malik05051/Limine-extra --yes
              echo "deleted $asset"
            done
          GH_TOKEN=$OWN_TOKEN gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --notes "Built by CI. Add this repository as described in the README."
