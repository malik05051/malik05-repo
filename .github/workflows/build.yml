name: Build and publish packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # pacman.conf [section] name, and the basename of the database files.
  REPO_NAME: malik05
  # Fixed release in this repository the database is published under. The
  # packages go to the "pacman" release of their own project, as
  # releases.conf maps them.
  RELEASE_TAG: repo
  # Set the GPG_PRIVATE_KEY secret to have packages and the database signed.
  # Everything below degrades to publishing them unsigned when it is absent.
  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    # The rename below needs bash parameter substitution; without this a
    # container job runs each step under sh.
    defaults:
      run:
        shell: bash

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git autoconf automake nasm mtools llvm clang lld github-cli gnupg

      - name: Checkout
        uses: actions/checkout@v4

      # makepkg refuses to run as root.
      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Import the signing key
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          set -eu
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          echo "GPG_KEY_ID=$fpr" >>"$GITHUB_ENV"
          echo "Signing as $fpr"

      - name: Build packages
        run: |
          set -eu
          mkdir -p /tmp/out
          chown builder:builder /tmp/out
          for pkgbuild in */PKGBUILD; do
            dir="$(dirname "$pkgbuild")"
            echo "::group::$dir"
            ( cd "$dir" && sudo -u builder PKGDEST=/tmp/out makepkg -s --noconfirm --needed )
            echo "::endgroup::"
          done
          ls -l /tmp/out

      - name: Make the filenames URL-safe
        run: |
          set -eu
          # makepkg spells an epoch with a colon, which GitHub silently
          # rewrites to a dot in a release asset name. repo-add would then
          # record a FILENAME that does not exist at the other end and every
          # download would 404, so the colon goes before anything reads the
          # name. pacman only ever uses FILENAME as a URL, so it need not
          # match the canonical package name.
          for pkg in /tmp/out/*:*; do
            [ -e "$pkg" ] || continue
            safe="${pkg//:/.}"
            mv "$pkg" "$safe"
            echo "renamed $(basename "$pkg") -> $(basename "$safe")"
          done

      - name: Sign the packages
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          set -eu
          for pkg in /tmp/out/*.pkg.tar.zst; do
            gpg --batch --yes --detach-sign --no-armor -u "$GPG_KEY_ID" "$pkg"
          done

      # GITHUB_TOKEN can only write to this repository. RELEASES_TOKEN is a
      # token allowed to write the contents of every repository in
      # releases.conf.
      - name: Publish the packages in their projects' releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -eu
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::the RELEASES_TOKEN secret is not set; see the README"
            exit 1
          fi
          for pkg in /tmp/out/*.pkg.tar.zst; do
            .github/scripts/publish-package "$pkg"
          done

      - name: Update the repository database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p /tmp/repo
          cp /tmp/out/*.pkg.tar.zst /tmp/repo/
          cp /tmp/out/*.pkg.tar.zst.sig /tmp/repo/ 2>/dev/null || true

          # Carry the published database forward rather than rebuilding it, so
          # that packages this run did not build keep their entries. Their
          # files stay in their releases untouched, which is what those
          # entries point at. Absent on the very first run.
          gh release download "$RELEASE_TAG" --dir /tmp/repo \
            --pattern "$REPO_NAME.db.tar.gz" \
            --pattern "$REPO_NAME.files.tar.gz" || true

          # Names no PKGBUILD builds any more. A carried-forward database would
          # otherwise keep offering them: both are earlier names of
          # limine-extra. One at a time, as repo-remove changes nothing when
          # any name it is given is missing.
          retired="limine limine-systemd-bootctl"

          if [ -n "${GPG_KEY_ID:-}" ]; then
            repo-add --sign --key "$GPG_KEY_ID" \
              "/tmp/repo/$REPO_NAME.db.tar.gz" /tmp/repo/*.pkg.tar.zst
            for name in $retired; do
              repo-remove --sign --key "$GPG_KEY_ID" \
                "/tmp/repo/$REPO_NAME.db.tar.gz" "$name" || true
            done
            gpg --export --armor "$GPG_KEY_ID" >"/tmp/repo/$REPO_NAME.asc"
          else
            repo-add "/tmp/repo/$REPO_NAME.db.tar.gz" /tmp/repo/*.pkg.tar.zst
            for name in $retired; do
              repo-remove "/tmp/repo/$REPO_NAME.db.tar.gz" "$name" || true
            done
          fi

          # repo-add leaves .db and .files (and their signatures) as symlinks
          # to the tarballs, and a release asset cannot be a symlink, so
          # publish copies instead.
          for suffix in '' .sig; do
            for name in db files; do
              rm -f "/tmp/repo/$REPO_NAME.$name$suffix"
              if [ -e "/tmp/repo/$REPO_NAME.$name.tar.gz$suffix" ]; then
                cp "/tmp/repo/$REPO_NAME.$name.tar.gz$suffix" \
                   "/tmp/repo/$REPO_NAME.$name$suffix"
              fi
            done
          done

          # The packages are published in their projects' releases; only the
          # database and the key belong here.
          rm -f /tmp/repo/*.pkg.tar.zst /tmp/repo/*.pkg.tar.zst.sig /tmp/repo/*.old /tmp/repo/*.old.sig

          ls -l /tmp/repo

      - name: Publish the database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --title "Package repository" \
              --notes "The pacman database. The packages are in their projects' releases; add this repository as described in the README."
          gh release upload "$RELEASE_TAG" /tmp/repo/* --clobber
