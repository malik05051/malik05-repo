name: Delete the projects' pacman releases

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - run: |
          set -eu
          for repo in malik05051/Limine-extra malik05051/limine-timeshift-sync \
                      malik05051/DLSS5-NeuralScreen-Linux malik05051/systemd-arab-edition; do
            if gh release view pacman --repo "$repo" >/dev/null 2>&1; then
              gh release delete pacman --repo "$repo" --yes --cleanup-tag
              echo "deleted $repo's pacman release"
            else
              echo "$repo has no pacman release"
            fi
          done
